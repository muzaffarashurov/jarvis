app:
  name: "JARVIS"
  tagline: "Modular AI Operating System"
  version: "0.1.0-alpha"

logging:
  level: "INFO"
  retention_days: 30
  console_enabled: false

paths:
  logs: "logs"
  data_input: "data/input"
  data_output: "data/output"
  data_cache: "data/cache"
  data_database: "data/database"
  knowledge: "knowledge"
  prompts: "prompts"

memory:
  # EP-013.2 Memory Configuration & Persistence. Read by MemoryService
  # ('memory.*'); the Memory subsystem is disabled entirely when
  # 'enabled' is false, and stays RAM-only when 'persistent' is false.
  enabled: true
  persistent: true
  storage_file: "data/database/memory.json"
  auto_save: true
  auto_save_interval: 60
  max_entries: 10000
  default_ttl: null
  # EP-023 Memory Manager. Name of the MemoryProvider activated at
  # startup; must match a provider name registered with MemoryManager.
  # The only provider registered today is "memory" (MemoryStoreProvider,
  # wrapping the MemoryStore above).
  default_provider: "memory"

knowledge:
  # EP-024 Knowledge Base. Structured project-knowledge records,
  # organized into named collections -- no memory, embeddings,
  # retrieval, or RAG (see src/core/knowledge/knowledge_manager.py).
  # 'default_provider' must match the name of the KnowledgeProvider
  # activated at startup. The only provider registered today is
  # "local" (KnowledgeCollectionProvider, wrapping a fresh, in-process
  # KnowledgeCollection).
  enabled: true
  default_provider: "local"

long_term_memory:
  # EP-025 Long-Term Memory. Persistent storage and lifecycle
  # management (active/archived) of long-lived memories -- no
  # ranking, similarity search, embeddings, or reasoning (see
  # src/core/long_term_memory/long_term_manager.py). Persists through
  # EP-024's Knowledge Base (a dedicated "long_term_memory"
  # collection), introducing no second storage engine.
  # 'default_provider' must match the name of the LongTermProvider
  # activated at startup. The only provider registered today is
  # "knowledge" (KnowledgeBackedLongTermProvider, wrapping the
  # KnowledgeService above).
  enabled: true
  default_provider: "knowledge"

orchestrator:
  skills_enabled: []

invoice:
  # Path to the existing external Invoice Automation script.
  # Jarvis only launches/monitors/stops this script; it never replaces it.
  script: "D:/Automation/InvoiceAutomation_Console_Mode_v4.2.2.py"

fast_response:
  # Existing Excel workbook Jarvis orchestrates (opens/backs up); Jarvis
  # never edits its cells directly.
  workbook: "D:/Reports/Fast Response Board.xls"
  worksheet: "July"
  backup_folder: "D:/Reports/Backup"

workflows:
  enabled: true
  auto_register: true

processes:
  auto_start: false
  dependency_check: true
  health_check_interval: 60

scheduler:
  enabled: true
  auto_start: true
  tick_interval: 1

plugins:
  enabled: true
  auto_load: true
  auto_discovery: true
  # Directory scanned by PluginDiscovery (EP-010), relative to the
  # project root. Each subdirectory is expected to contain a
  # manifest.yaml (see src/core/plugins/plugin_discovery.py for the
  # file layout). Missing directory = nothing to discover, not an error.
  plugin_directory: "plugins"

telegram:
  # EP-012 Telegram Gateway. Disabled by default -- Telegram is only an
  # external interface; the rest of Jarvis starts and runs normally
  # whether or not this section is configured.
  enabled: false
  auto_start: false
  token: ""
  allowed_chat_ids: []
  polling_interval: 2

telegram_info:
  # EP-040 Telegram Info. Read-only chat/channel metadata lookup
  # (get_chat only) against the Telegram Bot API, using the project's
  # existing "python-telegram-bot" dependency directly -- no new
  # dependency. No message reading, message history, chat discovery/
  # listing, or any write/mutating Telegram operation is implemented.
  #
  # Architecturally independent of EP-012 above: this subsystem
  # constructs its own, separate telegram.Bot connection and never
  # touches EP-012's fetch_updates()/getUpdates polling or its update
  # offset/cursor -- the two subsystems cannot race or interfere with
  # each other. The ONLY thing shared with EP-012 is the "token" value
  # directly above, read read-only -- IMPORTANT: there is deliberately
  # no separate token key here; do not add one.
  #
  # "enabled" defaults to true, matching every other soft-toggle
  # subsystem, and is independently toggleable from "telegram.enabled"
  # above -- one can be on while the other is off.
  #
  # "timeout_seconds" bounds the single get_chat call, so a hung/slow
  # network request cannot hang the calling thread indefinitely.
  enabled: true
  timeout_seconds: 10

discord:
  # EP-041 Discord Integration. Exposes five read-only operations
  # (get_guild, list_guild_channels, get_channel, get_guild_member,
  # get_message) against the Discord REST API v10, using the
  # project's existing "requests" dependency directly -- no Discord
  # SDK, no Gateway/WebSocket connection. No write/mutating operation
  # (send, edit, delete, create, moderation, webhooks, roles,
  # reactions, invites, ...) is implemented. This subsystem has no
  # dependency on any other Engineering Package's service or engine
  # (see src/core/discord/__init__.py), and is stateless -- no
  # persistent connection, no cursor/offset -- so a future Discord
  # Gateway EP could coexist without sharing state.
  #
  # IMPORTANT: authentication uses the DISCORD_TOKEN environment
  # variable ONLY. The token itself must never be placed here or in
  # any other config file -- only the two non-secret settings below.
  #
  # "enabled" defaults to true, matching every other soft-toggle
  # subsystem. An enabled DiscordService with no caller has zero
  # observable effect -- there is no thread or background work
  # started at construction time.
  #
  # "api_base_url" defaults to Discord's current REST API version
  # root; override only if Discord's API version changes.
  #
  # "timeout_seconds" bounds every Discord HTTP call, so a hung/slow
  # network request cannot hang the calling thread indefinitely.
  enabled: true
  api_base_url: "https://discord.com/api/v10"
  timeout_seconds: 30

email:
  # EP-042 Email Integration. Read-only IMAP access (list folders,
  # list messages, get message, search) against a standard,
  # provider-independent IMAP server, using the Python standard
  # library ('imaplib' + 'email') only -- no third-party dependency,
  # no provider-specific API (Gmail API / Microsoft Graph / Outlook
  # API), no OAuth. No send/reply/forward/delete/move/flag operation
  # is implemented -- this subsystem can only ever read from the
  # configured mailbox. This subsystem has no dependency on any other
  # Engineering Package's service or engine, and is stateless between
  # calls -- each operation opens one short-lived IMAP connection and
  # always closes it before returning; no persistent connection,
  # background thread, or polling exists anywhere in this subsystem.
  #
  # IMPORTANT: authentication uses environment variables ONLY -- the
  # two names below (defaults shown) tell EmailService which
  # environment variables to read the username/password from. The
  # actual credential values must never be placed here or in any
  # other config file.
  #
  # "enabled" defaults to false, unlike discord/github/telegram_info
  # above -- IMAP has no safe universal default host (unlike a fixed
  # REST API root), so this subsystem stays off until an operator
  # supplies "imap_host" and explicitly enables it.
  #
  # "tls_mode" must be "ssl" (implicit TLS, IMAPS, the default) or
  # "starttls" (plaintext connection upgraded via STARTTLS). Plaintext,
  # unencrypted IMAP is not supported by this subsystem.
  #
  # "timeout_seconds" bounds every IMAP call, so a hung/slow network
  # request cannot hang the calling thread indefinitely.
  enabled: false
  imap_host: ""
  imap_port: 993
  tls_mode: "ssl"
  imap_username_env_var: "EMAIL_IMAP_USERNAME"
  imap_password_env_var: "EMAIL_IMAP_PASSWORD"
  default_mailbox: "INBOX"
  default_message_limit: 50
  timeout_seconds: 30

voice:
  # EP-046 Speech-to-Text. Offline audio-to-text transcription (Vosk,
  # see src/skills/voice/speech_to_text.py), feeding recognized text
  # into the existing CommandRouter -- the same dispatch() entry
  # point the interactive shell, Telegram, and the REST API already
  # use (see src/core/command_router.py). No new dispatch mechanism,
  # no duplicated command parsing. Audio capture
  # (src/skills/voice/audio_capture.py, via 'sounddevice') is kept
  # architecturally separate from recognition.
  #
  # "enabled" defaults to false, matching Email/REST API's precedent:
  # this subsystem claims the microphone as a hardware resource, so
  # it stays off until an operator explicitly opts in. When false, no
  # "voice" command namespace is registered at all.
  #
  # "languages" lists every language 'voice listen'/'voice transcribe'
  # may recognize. Each entry requires its own Vosk model, manually
  # downloaded and extracted (no automatic downloader in EP-046) to
  # '<model_dir>/<language>/'. "default_language" (must be one of
  # "languages") is used when no language argument is given.
  #
  # Recommended small models (EP046_DESIGN.md Section 7/9c):
  #   ru -> vosk-model-small-ru-0.22   (~45 MB)
  #   uz -> vosk-model-small-uz-0.22   (~49 MB)
  #   en -> vosk-model-small-en-us-0.15 (~40 MB)
  # Source: https://alphacephei.com/vosk/models
  #
  # "min_confidence" (0.0-1.0, or null to disable the check): a
  # recognized command below this confidence is never dispatched --
  # only reported back with its text and confidence (owner Decision 9).
  # Vosk itself exposes only per-word confidence; VoskSpeechToTextEngine
  # normalizes an utterance-level value as the mean of per-word scores
  # (see speech_to_text.py's module docstring).
  #
  # "listen_duration_seconds" is v1's fixed recording length for
  # 'voice listen'/'voice transcribe' (no silence/voice-activity
  # detection yet -- EP046_DESIGN.md Section 5.1/9a).
  enabled: false
  engine: "vosk"
  languages: ["ru", "uz", "en"]
  default_language: "en"
  model_dir: "data/models/voice"
  offline_only: true
  device: null
  sample_rate: 16000
  listen_duration_seconds: 5
  timeout_seconds: 10
  min_confidence: 0.5

api:
  # EP-043 REST API. A local programmatic interface exposing the same
  # CommandRouter every CLI command already dispatches through (see
  # src/core/api/api_router.py) -- no separate business logic, no
  # duplicated Service/Core/Module layer. Implemented with the Python
  # standard library ('http.server') only -- no third-party HTTP
  # framework dependency.
  #
  # "enabled" defaults to false, unlike Discord/GitHub/Telegram Info's
  # "true" default: unlike those stateless outbound clients, starting
  # this subsystem binds and listens on a real network socket as a
  # side effect of application startup, so it stays off until an
  # operator explicitly opts in.
  #
  # "host" defaults to the loopback interface only (127.0.0.1) -- this
  # is EP-043 v1's primary security boundary. Do not set this to
  # "0.0.0.0" or a LAN-reachable address without adding real
  # authentication first; see docs/architecture/designs/EP043_DESIGN.md.
  #
  # "port" is the TCP port the REST API listens on when enabled.
  #
  # "web_dashboard_dir" (EP-045, optional): a directory of static
  # HTML/CSS/JS files RestApiServer will also serve, same-origin,
  # for any GET request that isn't one of the three API routes above.
  # This lets the EP-045 Web Dashboard be reached from the exact same
  # host:port as the API with no CORS policy needed (see
  # docs/architecture/designs/EP045_DESIGN.md, Section 21 "Option A").
  # Empty (the default) disables this entirely -- RestApiServer then
  # behaves exactly as it did before EP-045, returning 404 for any
  # unrecognized path.
  enabled: false
  host: "127.0.0.1"
  port: 8080
  web_dashboard_dir: "web/public"

ai:
  # EP-014 AI Provider Manager. Disabled provider selection by default
  # ("none") -- the rest of Jarvis never needs to know which provider
  # (if any) is active; see src/core/ai/provider_manager.py.
  enabled: true
  default_provider: "none"
  timeout: 120
  retry_count: 2
  max_context_messages: 20

conversation:
  # EP-016 Conversation Engine. Provider-independent chat session
  # storage shared by the CLI, Voice Assistant, Telegram, Desktop UI,
  # REST API and Scheduler; see src/core/ai/conversation_manager.py.
  # "default" is created automatically at startup.
  enabled: true
  auto_save: true
  max_messages: 100
  max_conversations: 100
  storage_file: "data/database/conversations.json"
  truncate_strategy: "oldest"

prompt:
  # EP-017 Prompt Engine. Provider-independent prompt composition
  # shared by every AI request; see src/core/ai/prompt_manager.py.
  # Templates are read from 'paths.prompts' (already reserved above).
  enabled: true
  system_prompt: ""
  append_datetime: false
  append_provider_name: false
  append_os_information: false
  append_working_directory: false
  max_prompt_size: 32000
  # EP-018.5 Unified Prompt Budget: 'max_prompt_size' above is the
  # ONE prompt-size authority in the project (see
  # src/core/ai/prompt_builder.py). ContextLoader's document budget is
  # derived from it: Document Budget = max_prompt_size - reserved_*
  # (sum of the four settings below). There is deliberately no
  # 'context.max_size'/'context.max_context_size' key anywhere in this
  # file any more -- a second, independent ceiling there is exactly
  # the bug EP-018.5 fixes. Tune these four instead.
  reserved_system_prompt: 2000
  reserved_conversation_history: 8000
  reserved_user_prompt: 2000
  reserved_provider_overhead: 1000

context:
  # EP-018 Context Loader. Provider-independent context gathering,
  # supplying the Prompt Engine's "Conversation Context" stage; see
  # src/core/ai/context_manager.py. 'include_environment' defaults to
  # false since even the safe whitelisted environment summary is
  # extra tokens most requests do not need. No sizing setting lives
  # here (see 'prompt.max_prompt_size' / 'prompt.reserved_*' above)
  # -- ContextLoader's document budget is injected, never configured
  # locally (EP-018.5).
  enabled: true
  auto_load: true
  include_environment: false
  include_working_directory: true
  include_project_files: true
  # EP-018.2 Smart Context Selection: when true, only the project
  # documents relevant to the current request are loaded (falling
  # back to README.md if none match); when false, every detected
  # project document is loaded on every request (EP-018.1 behavior).
  smart_selection: true

indexing:
  # EP-019 Project Index Engine integration. Read by IndexService
  # ('indexing.*'); ProjectIndexer itself takes no configuration (it
  # only exposes build/rebuild/load/save/clear) -- these settings
  # control the CLI integration layer only, i.e. which IndexStorage
  # backend 'index build'/'index rebuild' persist the built index to.
  # "json" persists to 'storage_file' (JsonIndexStorage); anything
  # else (e.g. "memory") keeps the index in process memory only
  # (MemoryIndexStorage).
  storage_backend: "json"
  storage_file: "data/database/project_index.json"

providers:
  # EP-014 AI Provider Manager. Every provider is disabled by default;
  # this section only describes how each provider would be reached
  # once implemented -- no network requests are made by this EP.
  claude:
    # EP-015 Claude Provider. Real Anthropic API integration; never
    # print or log 'api_key'.
    enabled: true
    api_key: ""
    model: "claude-sonnet-4"
    timeout: 120
    max_tokens: 4096
    temperature: 0.2
  openai:
    enabled: false
    api_key: ""
  gemini:
    # EP-015.1 Gemini Provider. Real Google Gemini API integration;
    # never print or log 'api_key'.
    enabled: true
    api_key: ""
    model: "gemini-flash-latest"
    timeout: 120
    temperature: 0.2
    max_tokens: 4096
  ollama:
    enabled: false
    endpoint: "http://localhost:11434"
  lmstudio:
    enabled: false
    endpoint: "http://localhost:1234"

embedding:
  # EP-021 Embedding Engine. Provider-independent vector embedding
  # generation only -- no retrieval, no RAG, no chat completion; see
  # src/core/embedding/manager.py. "local" is a fully offline,
  # deterministic provider (no network access, no third-party
  # dependency). "cloud" is a configuration-driven placeholder for a
  # future real cloud embedding integration -- it performs no network
  # requests in this Engineering Package (see
  # src/core/embedding/providers/cloud_provider.py); never print or
  # log its 'api_key'.
  enabled: true
  default_provider: "local"
  batch_size: 16
  providers:
    local:
      enabled: true
      model: "local-hash-v1"
      dimension: 256
    cloud:
      enabled: false
      api_key: ""
      model: "text-embedding-cloud-v1"
      dimension: 1536

rag:
  # EP-022 RAG Engine. Provider-independent context-generation
  # pipeline only -- combines ProjectIndexer (EP-019), RetrievalEngine
  # (EP-020) and the Embedding Engine (EP-021); never calls an AI
  # provider or performs chat completion (see src/core/rag/rag_engine.py).
  # "top_k" is the default maximum number of chunks assembled into
  # context per query; "max_context_characters" caps the assembled
  # context's total size. Both can be overridden per call via
  # 'rag query "<text>"'/'rag context "<text>"' in a future CLI
  # extension, but are not exposed as CLI arguments in this EP.
  enabled: true
  top_k: 5
  max_context_characters: 4000
  
semantic:
  # EP-026 Semantic Search. Provider-independent meaning-based
  # similarity search over Knowledge Base (EP-024) and Long-Term
  # Memory (EP-025) records, using vectors produced by the Embedding
  # Engine (EP-021) -- no AI providers, prompts, RAG, or reasoning
  # (see src/core/semantic/semantic_manager.py). "default_provider"
  # must match the name of the SemanticProvider activated at startup.
  # The only provider registered today is "semantic"
  # (DefaultSemanticProvider, cosine similarity). "top_k" is the
  # default maximum number of results per search; "similarity_threshold"
  # is the default minimum score (0.0-1.0) a result must reach. Both
  # can be overridden per call via SemanticEngine.search(), but are
  # not exposed as CLI arguments in this EP.
  enabled: true
  default_provider: "semantic"
  top_k: 5
  similarity_threshold: 0.70

context_compression:
  # EP-027 Context Compression. Shrinks already-assembled context (raw
  # text, or the results of EP-026 Semantic Search) to fit within a
  # maximum size -- no AI reasoning, no summarization, no LLM calls
  # (see src/core/context_compression/compression_manager.py).
  # "default_provider" must match the name of the CompressionProvider
  # activated at startup. The only provider registered today is
  # "compression" (DefaultCompressionProvider, deduplication + limit
  # enforcement). "max_context_characters" caps the compressed
  # context's total size; "max_chunks" caps the number of chunks kept;
  # "deduplicate" toggles duplicate chunk/paragraph removal. All three
  # can be overridden per call via CompressionManager's setters, but
  # are not exposed as CLI arguments in this EP (except indirectly
  # through 'compression limits').
  enabled: true
  default_provider: "compression"
  max_context_characters: 12000
  max_chunks: 20
  deduplicate: true

agent:
  # EP-028 Agent Framework. The central orchestration layer
  # coordinating already-implemented Engineering Packages -- agent
  # lifecycle, a subsystem registry, and request acknowledgment only.
  # No planning, reasoning, tool execution, or AI provider calls (see
  # src/core/agent/__init__.py). "default_agent" must match the name
  # of the AgentProvider activated at startup. The only agent
  # registered today is "jarvis" (DefaultAgentProvider). "startup_mode"
  # controls whether the selected agent is initialized automatically
  # at Bootstrap time ("auto") or left UNINITIALIZED until an explicit
  # 'agent initialize' call ("idle").
  enabled: true
  default_agent: "jarvis"
  startup_mode: "idle"
  
planning:
  # EP-029 Planning Engine. Decomposes a request into an ordered Plan
  # of steps referencing already-implemented Engineering Packages by
  # name -- deterministic, fixed keyword rules only, no AI reasoning,
  # no AI provider calls, no task execution (see
  # src/core/planning/__init__.py). "default_provider" must match the
  # name of the PlanningProvider activated at startup. The only
  # provider registered today is "planning" (DefaultPlanningProvider).
  # "max_steps" caps the number of steps a single Plan may contain.
  enabled: true
  default_provider: "planning"
  max_steps: 10

plan_execution:
  # EP-030 Plan Execution Engine. Dispatches an EP-029 Plan's steps, in
  # order -- deterministic, recognized-action dispatch only, no AI
  # reasoning, no AI provider calls, and no real subsystem invocation
  # (see src/core/plan_execution/__init__.py). NOT the same as the
  # unrelated, pre-existing 'src/core/execution/' package (EP-003's
  # OS-level target launcher). "default_provider" must match the name
  # of the PlanExecutionProvider activated at startup. The only
  # provider registered today is "plan_execution"
  # (DefaultPlanExecutionProvider). "stop_on_failure" controls whether
  # the remaining plan is skipped after a step fails.
  enabled: true
  default_provider: "plan_execution"
  stop_on_failure: true

tool:
  # EP-031 Tool Engine. Turns an already-identified (subsystem,
  # action) reference into a real invocation of an already-implemented
  # Engineering Package's public API -- no AI reasoning, no planning,
  # no plan walking (see src/core/tool/__init__.py). "default_provider"
  # must match the name of the ToolProvider activated at startup. The
  # only provider registered today is "tool_engine"
  # (DefaultToolProvider). Registered as an additional plan-execution
  # provider ("tool_engine") too, but NOT selected by default --
  # 'plan_execution.default_provider' above stays "plan_execution"
  # unless an operator explicitly runs 'execution use tool_engine'.
  enabled: true
  default_provider: "tool_engine"

collaboration:
  # EP-032 Multi-Agent Collaboration. Implements the Multi-Agent
  # Coordinator explicitly deferred by EP-028 through EP-030 -- reads
  # the live agent catalog from EP-028's Agent Framework and
  # deterministically broadcasts a request to every currently
  # registered agent, collecting each agent's own outcome. No AI
  # reasoning, no negotiation, no inter-agent messaging (see
  # src/core/collaboration/__init__.py). "default_provider" must match
  # the name of the CollaborationProvider activated at startup. The
  # only provider registered today is "collaboration"
  # (DefaultCollaborationProvider). Has a hard dependency on the Agent
  # Framework being available this run -- if 'agent.enabled' is false
  # (or 'agent.*' configuration is invalid), Multi-Agent Collaboration
  # is skipped entirely for this run.
  enabled: true
  default_provider: "collaboration"

workflow_engine:
  # EP-033 Workflow Engine. Runs a named, ordered sequence of
  # plain-text requests as a single, repeatable unit -- each step is
  # planned and executed through EP-030's already-existing Plan
  # Execution Engine, in order, halting on failure per
  # "stop_on_failure". No AI reasoning, no new planning logic, no
  # direct real-subsystem/tool invocation (see
  # src/core/workflow_engine/__init__.py). "default_provider" must
  # match the name of the WorkflowRunProvider activated at startup.
  # The only provider registered today is "workflow_engine"
  # (DefaultWorkflowRunProvider). Deliberately distinct from the
  # pre-existing, unrelated "workflows" section above (EP-007's
  # dormant WorkflowService/WorkflowModule) -- see this package's own
  # naming-collision note. Has a hard dependency on a live Plan
  # Execution Engine instance existing this run -- only a genuine
  # 'plan_execution.*' configuration error (not merely
  # 'plan_execution.enabled: false', which still constructs a valid,
  # if disabled, Plan Execution Engine) skips Workflow Engine entirely
  # for this run.
  enabled: true
  default_provider: "workflow_engine"
  stop_on_failure: true

workflow_scheduler:
  # EP-034 Workflow Scheduler. Gives an EP-033 workflow definition a
  # time trigger -- runs it automatically on a schedule
  # (interval/daily/weekly/once/manual; cron is an interface only, not
  # yet implemented), by calling EP-033's already-existing
  # WorkflowEngine.run() exclusively. No AI reasoning, no planning, no
  # direct subsystem/tool invocation (see
  # src/core/workflow_scheduler/__init__.py). Deliberately distinct
  # from the pre-existing, ACTIVE "scheduler" section below (EP-011's
  # Task Scheduler, which remains completely untouched) -- see this
  # package's own naming-collision note. "auto_start" defaults to
  # false (unlike "scheduler.auto_start"), since no scheduled workflow
  # is registered out of the box -- nothing to run automatically yet.
  # Has a hard dependency on a live Workflow Engine instance existing
  # this run -- only a genuine configuration error (in
  # 'workflow_engine.*' or, transitively, 'plan_execution.*') skips
  # Workflow Scheduler entirely for this run.
  enabled: true
  auto_start: false
  tick_interval: 5

automation:
  # EP-035 Automation Engine. Chains one EP-033 workflow's completion
  # (started on-demand via 'flow run', or automatically via EP-034's
  # scheduler) into a second workflow run, based on outcome
  # (ON_SUCCESS / ON_FAILURE / ON_ANY), by calling EP-033's
  # already-existing WorkflowEngine.run() exclusively. No AI
  # reasoning, no scheduling of its own, no event bus, no recursive
  # chaining (see src/core/automation_engine/__init__.py). Purely
  # reactive: unlike workflow_scheduler, this subsystem owns no
  # background thread and has no 'auto_start'/'tick_interval' of its
  # own -- it only ever runs in response to another EP's own
  # execution path calling AutomationEngine.notify_run().
  enabled: true

background_workers:
  # EP-036 Background Worker Pool. Runs already-registered EP-033
  # WorkflowDefinitions in the background, off the calling thread, by
  # dispatching each submitted workflow_id through the already-existing
  # WorkflowEngine.run() exclusively -- the same "reach a completed EP
  # only through its public API" discipline EP-034's WorkflowSchedulerEngine
  # and EP-035's AutomationEngine already follow (see
  # src/core/background_workers/__init__.py). No AI reasoning, no planning,
  # and no direct real-subsystem/tool invocation is performed here or
  # anywhere in this package -- this subsystem only decides which thread
  # an already-completed EP's public API call happens to run on.
  #
  # "enabled" defaults to true: an enabled pool with nothing submitted to
  # it is just worker_count idle daemon threads -- STEP 2 wires no producer
  # that calls submit() automatically, so this has no other observable
  # effect this run (see BackgroundWorkerService's own module docstring
  # for the full backward-compatibility reasoning).
  #
  # "worker_count" is the number of daemon worker threads started
  # immediately when this subsystem is enabled (BackgroundWorkerPool starts
  # its threads at construction time -- there is no separate "start" step).
  #
  # "shutdown_timeout" bounds how long BackgroundWorkerService.shutdown()
  # waits for in-flight tasks to finish before giving up (seconds).
  # Application-level shutdown wiring (calling shutdown() from
  # src/main.py at process exit) is deferred to a later EP-036 step -- this
  # setting exists so that later wiring is a pure addition, not a config
  # change.
  enabled: true
  worker_count: 4
  shutdown_timeout: 10

git:
  # EP-038 Git Integration. Exposes five read-only operations (status,
  # diff, log, branch, show) by shelling out to the system "git"
  # executable via subprocess -- no third-party git library dependency.
  # No remote or destructive operation (push, pull, clone, commit) is
  # implemented. This subsystem has no dependency on any other
  # Engineering Package's service or engine (see src/core/git/__init__.py).
  #
  # "enabled" defaults to true, matching every other soft-toggle
  # subsystem. An enabled GitService with no caller has zero observable
  # effect -- unlike BackgroundWorkerPool, there is no thread or
  # background work started at construction time.
  #
  # "repository_path" is null by default, which Bootstrap resolves to
  # its own project root. Set this to inspect a different repository's
  # working tree instead.
  #
  # "timeout_seconds" bounds every git subprocess call, so a hung git
  # process (e.g. one waiting on a credential prompt this subsystem
  # never supplies, since no remote operation is in scope) cannot hang
  # the calling thread indefinitely.
  enabled: true
  repository_path: null
  timeout_seconds: 10

github:
  # EP-039 GitHub Integration. Exposes eight read-only operations
  # (repository info, list repositories, list/get issue, list/get
  # pull request, list/get commit) against the GitHub REST API, using
  # the project's existing "requests" dependency directly -- no
  # GitHub SDK. No write/mutating operation (create, comment, merge,
  # close, reopen, release, ...) is implemented. This subsystem has
  # no dependency on any other Engineering Package's service or
  # engine (see src/core/github/__init__.py).
  #
  # IMPORTANT: authentication uses the GITHUB_TOKEN environment
  # variable ONLY. The token itself must never be placed here or in
  # any other config file -- only the two non-secret settings below.
  #
  # "enabled" defaults to true, matching every other soft-toggle
  # subsystem. An enabled GitHubService with no caller has zero
  # observable effect -- there is no thread or background work
  # started at construction time.
  #
  # "api_base_url" defaults to the real GitHub REST API root;
  # override for a GitHub Enterprise Server deployment.
  #
  # "timeout_seconds" bounds every GitHub HTTP call, so a hung/slow
  # network request cannot hang the calling thread indefinitely.
  enabled: true
  api_base_url: "https://api.github.com"
  timeout_seconds: 30